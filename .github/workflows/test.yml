name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same ref makes the in-flight run irrelevant.
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Test
        run: python -m pytest -q

      # The vendored grammar must match its recorded hash, and the checked-in
      # ANTLR parser must have been generated from it. This needs no network and
      # no DLe checkout; comparing against the reference implementation is a
      # separate, scheduled workflow.
      - name: Grammar hash
        run: python tools/grammar.py check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyflakes
      - name: Unused imports and undefined names
        run: python -m pyflakes src/addle/*.py tools/*.py tests/*.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*

      # Installing the wheel into a clean environment is the only way to catch a
      # missing package-data file: header.txt and the generated parser are needed
      # at runtime, and the source tree would hide their absence.
      #
      # The smoke test goes through a file rather than `python -c`: DLe is full of
      # non-ASCII operators, and passing those through the shell depends on the
      # runner's locale. A .py file is read as UTF-8 regardless.
      - name: Wheel is self-contained
        run: |
          cat > /tmp/smoke.py <<'PY'
          import addle

          onto = addle.loads("Animal ⊑ ∃owns.Plant\n")
          text = addle.dumps(onto, include_header=False)
          assert "Animal ⊑ ∃owns.Plant" in text, text
          assert addle.header_text().startswith("# DLe"), "header.txt missing from wheel"
          print("wheel OK", addle.__version__)
          PY
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          cd /tmp && /tmp/fresh/bin/python /tmp/smoke.py
          /tmp/fresh/bin/addle --version
