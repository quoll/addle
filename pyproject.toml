[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "addle"
version = "0.1.0"
description = "A DLe (Description Logic, Extended) parser and writer for Owlready2"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Paula Gearon" }]
keywords = ["owl", "ontology", "description-logic", "dle", "owlready2", "semantic-web"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    # Owlready2 is LGPL-3.0; addle is Apache-2.0 and imports it as a separate
    # library, which the LGPL permits.
    "owlready2>=0.47",
    # Must match the ANTLR tool version used to generate src/addle/_antlr.
    "antlr4-python3-runtime>=4.13,<4.14",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/quoll/addle"
Documentation = "https://github.com/quoll/DLe/wiki"
"DLe syntax" = "https://github.com/quoll/DLe/wiki"
"Reference implementation" = "https://github.com/quoll/DLe"

[project.scripts]
addle = "addle.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
addle = ["header.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
